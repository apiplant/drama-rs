[package]
name = "drama-rs"
version = "0.1.0"
edition = "2021"
description = "Fish Audio Drama 3 text-to-speech on a single 24 GB GPU"

[[bin]]
name = "drama"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
hound = "3.5"
memmap2 = "0.9"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[profile.release]
debug = 1
